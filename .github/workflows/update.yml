name: Daily update

on:
  schedule:
    - cron: "0 5 * * *"   # 5h UTC = 6h in Paris in winter, 7h in summer
  workflow_dispatch:       # "Run workflow" button to launch it manually

permissions:
  contents: write          # allows the workflow to push the updated files

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate files
        run: |
          python index.py --cidr
          python index.py --dedupe
          python index.py --compact

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add target/amazon_ip_ranges.txt target/amazon_ip_ranges_dedupe.txt target/amazon_ip_ranges_compact.txt
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "$(date -u +'%Y %m %d') Update"
            git push
          fi
